name: Verify and publish platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            game/requirements.txt
            portal/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r game/requirements.txt -r portal/requirements.txt
      - run: python -m unittest discover -s game/tests -v
      - run: python -m unittest discover -s portal/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python game/tools/audit_v88_complete.py
      - run: python game/tools/audit_v89_ui.py
      - run: node --check game/static/js/app-v89.js
      - name: Prepare isolated container test state
        run: |
          python -c "import secrets; from pathlib import Path; Path('.env.portal').write_text('FLASK_SECRET_KEY='+secrets.token_hex(32)+'\n')"
          mkdir -p state/portal
          sudo chown 10001:10001 state/portal
      - run: docker compose -f compose.platform.yaml config --quiet
      - run: docker compose -f compose.platform.yaml build
      - run: docker compose -f compose.platform.yaml run --rm --no-deps portal python seed.py
      - run: docker compose -f compose.platform.yaml up -d --no-build --wait --wait-timeout 180
      - run: python deploy/smoke.py
      - if: always()
        run: |
          docker compose -f compose.platform.yaml logs --no-color --tail 100
          docker compose -f compose.platform.yaml down
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        component: [game, portal]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'portal' && './portal' || '.' }}
          file: ${{ matrix.component == 'portal' && './portal/Dockerfile' || './Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
