name: Verify and publish Docker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: game/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r game/requirements.txt
      - run: python -m unittest discover -s game/tests -v
      - run: python game/tools/audit_v88_complete.py
      - run: python game/tools/audit_v89_ui.py
      - run: node --check game/static/js/app-v89.js
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Check HTTP and speech engine
        run: |
          curl --fail http://127.0.0.1:5080/healthz
          curl --fail http://127.0.0.1:5080/api/bootstrap -o /tmp/bootstrap.json
          curl --fail 'http://127.0.0.1:5080/api/tts?text=Xin%20chao&lang=vi' -o /tmp/speech.wav
          python -c "import wave; w=wave.open('/tmp/speech.wav'); assert w.getnframes()>0"
      - if: always()
        run: docker compose logs --no-color && docker compose down
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/game" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
